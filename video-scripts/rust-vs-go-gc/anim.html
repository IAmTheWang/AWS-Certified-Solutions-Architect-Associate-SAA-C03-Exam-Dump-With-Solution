  .e{position:absolute;left:0;top:0;white-space:nowrap}

<body>
<div id="stage"></div>
<script src="build/timing.js"></script>
<script>
/* ============ 引擎：确定性关键帧动画，window.setT(t) 渲染任意时刻 ============ */
const stage = document.getElementById('stage');
const Q = new URLSearchParams(location.search);
const CAPTIONS = Q.get('cap') === '1';
const EASE = {
  lin: x => x, out: x => 1 - Math.pow(1 - x, 3), in: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  bounce: x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; }
};
let ALL = [];
class El {
  constructor(parent, html, css = {}, init = {}) {
    this.n = document.createElement('div'); this.n.className = 'e'; this.n.innerHTML = html || '';
    Object.assign(this.n.style, css);
    this.t = { x: [], y: [], s: [], r: [], o: [] };
    this.base = Object.assign({ x: 0, y: 0, s: 1, r: 0, o: 1 }, init);
    this.fx = []; this.cb = [];
    (parent.n || parent).appendChild(this.n); ALL.push(this);
  }
  val(p, t) {
    const a = this.t[p]; if (!a.length) return this.base[p];
    if (t <= a[0].t) return a[0].v; const L = a[a.length - 1]; if (t >= L.t) return L.v;
    for (let i = 1; i < a.length; i++) if (t <= a[i].t) {
      const A = a[i - 1], B = a[i]; const u = (t - A.t) / ((B.t - A.t) || 1e-6);
      return A.v + (B.v - A.v) * EASE[B.e || 'io'](u);
    }
  }
  k(p, t, v, e) { const a = this.t[p]; a.push({ t, v, e }); a.sort((x, y) => x.t - y.t); return this; }
  to(t0, t1, props, e = 'io') { for (const p in props) { this.k(p, t0, this.val(p, t0), 'lin'); this.k(p, t1, props[p], e); } return this; }
  at(t, props) { for (const p in props) { this.k(p, t - .001, this.val(p, t - .001), 'lin'); this.k(p, t, props[p], 'lin'); } return this; }
  pop(t, d = .45) { const b = this.base.s;
    return this.k('o', t, 0, 'lin').k('o', t + .08, 1, 'lin').k('s', t, 0, 'lin').k('s', t + d * .6, 1.18 * b, 'out').k('s', t + d, b, 'io'); }
  fade(t0, t1, o0, o1) { return this.k('o', t0, o0, 'lin').k('o', t1, o1, 'lin'); }
  hide(t, d = .25) { return this.k('o', t, this.val('o', t), 'lin').k('o', t + d, 0, 'lin'); }
  wob(fn) { this.fx.push(fn); return this; }
  cust(fn) { this.cb.push(fn); return this; }
  render(t) {
    let x = this.val('x', t), y = this.val('y', t), s = this.val('s', t), r = this.val('r', t), o = this.val('o', t);
    for (const f of this.fx) { const d = f(t) || {}; x += d.dx || 0; y += d.dy || 0; r += d.dr || 0; s *= (d.ds == null ? 1 : d.ds); }
    this.n.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${Math.max(s, 0)})`;
    this.n.style.opacity = Math.max(0, Math.min(1, o));
    this.n.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
    for (const f of this.cb) f(t, this);
  }
}
const kf = pairs => t => { if (t <= pairs[0][0]) return pairs[0][1]; const L = pairs[pairs.length - 1]; if (t >= L[0]) return L[1];
  for (let i = 1; i < pairs.length; i++) if (t <= pairs[i][0]) { const [a, va] = pairs[i - 1], [b, vb] = pairs[i]; const u = (t - a) / (b - a || 1e-6); return va + (vb - va) * (u * u * (3 - 2 * u)); } };

/* ---- 常用元件 ---- */
const mk = (p, html, x, y, css = {}, init = {}) => new El(p, html, css, Object.assign({ x, y }, init));
const emo = (p, ch, x, y, size, init = {}, css = {}) => mk(p, ch, x, y, Object.assign({ fontSize: size + 'px' }, css), init).cust((t, e) => { e.n.classList.add('emo'); });
const txt = (p, s, x, y, size, color = '#3b2a20', css = {}, init = {}) => mk(p, s, x, y, Object.assign({ fontSize: size + 'px', fontWeight: 800, color }, css), init);
const pill = (p, s, x, y, bg, size = 40, init = {}) => { const e = mk(p, s, x, y, { fontSize: size + 'px', background: bg }, init); e.n.classList.add('pill'); return e; };
const grp = (p, init = {}) => mk(p, '', 960, 540, { width: '1920px', height: '1080px', pointerEvents: 'none' }, init);
const box = (p, x, y, w, h, bg, rad = 24, css = {}) => mk(p, '', x, y, Object.assign({ width: w + 'px', height: h + 'px', background: bg, borderRadius: rad + 'px' }, css));
const bg = (g, css) => { g.n.style.background = css; };
const chip = (g, s, color) => { const e = pill(g, s, 0, 0, color, 38); e.base.x = 60 + 10; e.n.style.transformOrigin = '0 50%'; e.base.x = 40; e.base.y = 60; e.n.style.left = '0'; e.n.style.top = '0'; e.n.style.transform = ''; e.render = function (t) { this.n.style.transform = 'translate(40px,36px)'; }; return e; };
// 水平进度条：容器固定、内部填充（左对齐）
const bar = (p, x, y, w, h, color, frac, rad = 14, bgc = 'rgba(0,0,0,.12)') => {
  const e = mk(p, `<div style="width:0;height:100%;background:${color};border-radius:${rad}px"></div>`, x, y,
    { width: w + 'px', height: h + 'px', background: bgc, borderRadius: rad + 'px', overflow: 'hidden' });
  e.cust((t, el) => { el.n.firstChild.style.width = (Math.max(0, Math.min(1, frac(t))) * 100) + '%'; });
  return e;
};
const table = (p, dark, light, labelColor = '#fff') => {
  const g = grp(p);
  box(g, 960, 790, 1640, 36, light, 18);
  box(g, 960, 915, 1560, 214, dark, 30);
  txt(g, '工作台 = 内存', 960, 925, 54, labelColor, { opacity: .9 });
  return g;
};
const hud = (g, memFn, cpuFn, t0, dark = false) => {
  const h = grp(g); h.fade(t0, t0 + .4, 0, 1);
  box(h, 310, 200, 540, 150, dark ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.85)', 26, { boxShadow: '0 8px 24px rgba(0,0,0,.15)' });
  const col = dark ? '#ffe0b2' : '#3b2a20';

  const mem = bar(h, 330, 170, 280, 36, '#43a047', memFn); const cpu = bar(h, 330, 230, 280, 36, '#1e88e5', cpuFn);
  mem.cust((t, e) => { const v = memFn(t); e.n.firstChild.style.background = v > .85 ? '#e53935' : v > .6 ? '#fb8c00' : '#43a047'; });
  const mp = txt(h, '', 515, 170, 30, col).cust((t, e) => { e.n.textContent = Math.round(memFn(t) * 100) + '%'; });
  const cp = txt(h, '', 515, 230, 30, col).cust((t, e) => { e.n.textContent = Math.round(cpuFn(t) * 100) + '%'; });
  return h;
};
const card = (g, t0, t1, title, color = '#1e88e5') => {
  const c = grp(g, { x: 1230 }); c.n.style.transformOrigin = '50% 29%'; c.pop(t0, .4); if (t1) c.hide(t1, .25);
  box(c, 960, 315, 1120, 410, '#fff', 36, { boxShadow: '0 14px 40px rgba(0,0,0,.25)' });
  box(c, 960, 160, 1120, 90, color, 36);
  box(c, 960, 190, 1120, 30, color, 0);
  txt(c, title, 960, 162, 50, '#fff');
  return c;
};

/* ============ 时间轴：每个场景由若干"旁白句"驱动 ============ */
function sceneTiming(si) {
  const sc = TIMING[si]; let acc = 0; const starts = [], spans = [];
  sc.beats.forEach(b => { starts.push(acc + b.lead); spans.push(b.dur - b.lead); acc += b.dur; });
  return { D: sc.dur, A: (i, f = 0) => starts[i] + f * spans[i], starts, spans, beats: sc.beats };
}
const scenes = [];

/* ---------- 场景 1：内存 = 工作台 ---------- */
scenes.push((g, A, D) => {
  bg(g, 'linear-gradient(#fff3e0,#ffd9a8)');
  chip(g, '① 内存 = 工作台', '#ef6c00');
  const all = grp(g);
  const tb = table(all, '#8d5a2b', '#c98d52'); tb.k('y', 0, 540 + 420, 'lin').k('y', A(0, .5), 540, 'back');
  const title = txt(all, '电脑内存 = 一张工作台', 960, 330, 104, '#e65100'); title.pop(A(0, .3), .5).hide(A(1, .05), .3);

  pill(all, '下载的数据', 1520, 560, '#1e88e5', 46).pop(A(1, .7), .4).hide(A(2, 0));

  let n = 0; const rows = [7, 6, 5, 4];
  rows.forEach((cnt, r) => { for (let c = 0; c < cnt; c++) {
    const x = 380 + c * 230 + (r % 2) * 100, ty = 715 - r * 118; const t0 = A(2, .04 + (n++) * .033);
    const e = emo(all, junk[(c + r) % junk.length], x, ty, r === 0 ? 120 : 110, { r: (c * 37 + r * 53) % 50 - 25 });
    e.k('o', t0, 0, 'lin').k('o', t0 + .05, 1, 'lin').k('y', t0, -120, 'lin').k('y', t0 + .6, ty, 'bounce');
    // 旧食材被垃圾盖住
  } });
  pill(all, '葱皮、空碗 = 垃圾 Garbage', 960, 215, '#8d6e63', 50).pop(A(2, .05), .4).hide(A(2, .8), .3);
  // 新菜放不下
  const dish = emo(all, '🍲', 160, 470, 150); dish.pop(A(2, .5), .4).to(A(2, .58), A(2, .66), { x: 560, y: 560, r: 20 }, 'out').to(A(2, .66), A(2, .76), { x: 160, y: 470, r: -20 }, 'out');
  pill(all, '没地方放了！', 360, 380, '#e53935', 44).pop(A(2, .62), .3).hide(A(2, .8), .2);
  const ts = A(2, .8);
  emo(all, '💥', 430, 300, 190).pop(ts, .4); emo(all, '💥', 1490, 300, 190).pop(ts + .05, .4);
  const oom = pill(all, 'OOM 内存溢出 · 直接卡死', 960, 300, '#d32f2f', 96, { r: -5 }); oom.pop(ts, .45);
  all.wob(t => t > ts ? { dx: Math.sin(t * 70) * 14 * Math.exp(-(t - ts) * 2.5), dy: Math.cos(t * 55) * 9 * Math.exp(-(t - ts) * 2.5) } : {});
  all.hide(A(3, .02), .3);
  const hd = hud(g, kf([[A(1, 0), .08], [A(1, .9), .3], [A(2, .0), .3], [A(2, .75), 1]]), kf([[0, .1], [D, .1]]), A(1, 0)); hd.hide(A(3, 0), .3);
  // 收束：GC = ?
  const fin = grp(g);
  txt(fin, 'GC 到底是什么？', 960, 330, 120, '#e65100').pop(A(3, .12), .5);
  emo(fin, '🐹', 560, 640, 250).pop(A(3, .5), .5); txt(fin, 'Go', 560, 810, 80, '#0288d1').pop(A(3, .5), .4);
  txt(fin, 'VS', 960, 640, 110, '#8d6e63').pop(A(3, .62), .4);
  emo(fin, '🦀', 1360, 640, 250).pop(A(3, .72), .5); txt(fin, 'Rust', 1360, 810, 80, '#e64a19').pop(A(3, .72), .4);
});

/* ---------- 场景 2：Go = 厨师 + 保洁阿姨 ---------- */
scenes.push((g, A, D) => {
  bg(g, 'linear-gradient(#fff3e0,#ffd9a8)');

  const tb = table(g, '#8d5a2b', '#c98d52'); tb.fade(0, .3, 0, 1);
  const mem = kf([[0, .2], [A(1, 0), .2], [A(1, .9), .62], [A(2, .38), .64], [A(2, .6), .3], [A(3, 0), .3], [A(3, .8), .8], [A(4, 0), .8], [A(5, 0), .5]]);
  const cpu = kf([[0, .3], [A(1, .9), .4], [A(2, .3), .62], [A(2, .9), .5], [A(4, 0), .4], [A(4, .75), .7], [A(5, 0), .7]]);
  hud(g, mem, cpu, A(0, .5));
  // 厨师 & 阿姨

  chef.wob(t => t > A(1, 0) && !frozen(t) ? { dy: Math.sin(t * 7) * 9, dr: Math.sin(t * 5) * 4 } : {});
  const aunt = emo(g, '👵', 1560, 640, 250, { x: 2200 }); aunt.to(A(0, .5), A(0, .9), { x: 1560 }, 'back');
  const broom = emo(g, '🧹', 1440, 700, 140, { x: 2200 }); broom.to(A(0, .5), A(0, .9), { x: 1440 }, 'back');
  pill(g, 'Go 程序 · 厨师', 300, 455, '#0288d1', 40).pop(A(0, .45), .4);
  pill(g, 'GC · 保洁阿姨', 1560, 455, '#2e7d32', 40).pop(A(0, .95), .4);
  txt(g, '数字为示意', 1830, 1040, 26, 'rgba(59,42,32,.5)');
  // 阿姨动作
  const ax = [[A(2, .04), 1560], [A(2, .16), 1330], [A(2, .9), 1330], [A(2, 1), 1560]];
  aunt.to(A(2, .04), A(2, .16), { x: 1330 }, 'io').to(A(2, .9), A(3, 0), { x: 1560 }, 'io');
  broom.to(A(2, .04), A(2, .16), { x: 1210 }, 'io').to(A(2, .9), A(3, 0), { x: 1440 }, 'io');

  const beef = emo(g, '🥩', 770, 715, 120); beef.pop(A(1, 0), .4);

      .k('y', t0, 620, 'lin').k('y', t0 + .25, 400, 'out').k('y', t0 + .55, 715, 'in').k('r', t0, 0, 'lin').k('r', t0 + .55, 300 + i * 40, 'out');

  pill(g, '锅往旁边一推', 560, 560, '#8d6e63', 42).pop(A(1, .66), .35).hide(A(1, .95), .25);

  pill(g, '不要了，扔掉 🗑️', 1000, 400, '#e53935', 46).pop(A(2, .31), .35).hide(A(2, .58), .2);
  pill(g, '这盘牛肉还连着炒锅吗？', 1000, 400, '#2e7d32', 46).pop(A(2, .6), .35).hide(A(2, .8), .15);
  pill(g, '还在用，留着 ✅', 1000, 400, '#2e7d32', 46).pop(A(2, .82), .35).hide(A(3, 0), .3);
  // 代价 ①
  const c1 = card(g, A(3, .16), A(4, .03), '代价① 多占好几倍的地方', '#0288d1');
  txt(c1, '实际用量', 560, 262, 38, '#3b2a20'); txt(c1, 'Go 申请的内存', 540, 352, 38, '#0288d1');
  box(c1, 960, 307, 0, 0, 'transparent', 0); // spacer
  const band = box(c1, 840 + 0, 352, 240, 70, 'rgba(229,57,53,.15)', 10, { border: '3px dashed #e53935' }); band.n.style.left = '0';
  band.base.x = 720 + 240 + 120; band.base.y = 352;
  bar(c1, 720 + 350, 262, 700, 56, '#43a047', t => 160 / 700, 14, 'transparent').base.x = 720 + 350;
  bar(c1, 720 + 350, 352, 700, 56, '#0288d1', kf([[A(3, .3), 160 / 700], [A(3, .6), 400 / 700]]), 14, 'transparent').base.x = 720 + 350;
  txt(c1, '1×', 760 + 160 + 60, 262, 38, '#2e7d32');
  txt(c1, '1.5 ~ 3 倍', 1330, 307, 56, '#d32f2f').pop(A(3, .62), .4);
  txt(c1, '台子越小，阿姨越来不及收 → 多留缓冲', 960, 445, 38, '#6d4c41').pop(A(3, .78), .4);
  // 代价 ②
  const c2 = card(g, A(4, .06), A(5, .03), '代价② 偷偷消耗体力（CPU）', '#2e7d32');
  const sx = 960 - 450;
  const seg1 = box(c2, sx + 180, 300, 360, 90, '#1e88e5', 14); seg1.pop(A(4, .25), .4);
  txt(seg1, '', 0, 0, 0); seg1.n.innerHTML = '<div style="color:#fff;font-size:40px;font-weight:800;line-height:90px;text-align:center">厨师炒菜 40%</div>';
  const seg2 = box(c2, sx + 360 + 135, 300, 270, 90, '#43a047', 14); seg2.pop(A(4, .45), .4);
  seg2.n.innerHTML = '<div style="color:#fff;font-size:40px;font-weight:800;line-height:90px;text-align:center">GC 20~30%</div>';
  box(c2, sx + 630 + 135, 300, 270, 90, '#cfd8dc', 14).pop(A(4, .25), .4);
  txt(c2, '同样一份电，白白少了一块', 960, 440, 46, '#6d4c41').pop(A(4, .7), .4);
  // 代价 ③
  const c3 = card(g, A(5, .06), null, '代价③ 偶尔的暂停打扰', '#e65100');
  const W3 = 800, X3 = 560, spikes = [.2, .45, .72];
  const ch = mk(c3, '', 960, 265, { width: W3 + 'px', height: '120px' });

  txt(s3, '选 Go 还是 Rust？看你的场景', 960, 980, 80, '#2e7d32').pop(A(3, .62), .5);
});

/* ============ 渲染入口 ============ */
let CUR = { si: 0, tm: null, root: null };
window.buildScene = si => {
  stage.innerHTML = ''; ALL = [];
  const tm = sceneTiming(si);
  const root = grp(stage); root.n.style.overflow = 'hidden';
  root.n.style.left = '0'; root.n.style.top = '0';
  root.render = function (t) { this.n.style.transform = 'translate(0,0)'; this.n.style.opacity = Math.min(1, t / .35) * Math.min(1, (tm.D - t) / .35); };
  scenes[si](root, tm.A, tm.D);
  if (CAPTIONS) { const c = document.createElement('div'); c.id = 'cap'; c.innerHTML = '<span></span>'; stage.appendChild(c); CUR.cap = c.firstChild; }
  CUR = Object.assign(CUR, { si, tm, root });
  window.setT(0);
  return { D: tm.D, scenes: TIMING.length };
};
window.setT = t => {
  const tm = CUR.tm; t = Math.max(0, Math.min(tm.D - .001, t));
  for (const e of ALL) e.render(t);
  if (CAPTIONS && CUR.cap) { let idx = -1; tm.starts.forEach((s, i) => { if (t >= s - .02) idx = i; });
    CUR.cap.textContent = idx >= 0 && t < tm.starts[idx] + tm.spans[idx] - .35 ? tm.beats[idx].text : ''; CUR.cap.style.display = CUR.cap.textContent ? 'inline-block' : 'none'; }
};
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${k})`; }
if (!Q.get('render')) { addEventListener('resize', fit); fit(); }
// 预览：直接在浏览器里打开 anim.html?scene=0 即可循环播放
if (!Q.get('render')) {
  const si = +(Q.get('scene') || 0); const info = buildScene(si); const t0 = performance.now();
  (function loop() { setT(((performance.now() - t0) / 1000) % info.D); requestAnimationFrame(loop); })();
}
</script>
